name: Build APK
on: [workflow_dispatch, push]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Generate Android project
        run: flutter create --platforms=android --project-name voice_clone_ai --org com.voiceclone .
      - name: Permissions and Arabic app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.RECORD_AUDIO"/><application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Voice Clone AI"#' $M
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=API_BASE=${{ vars.API_BASE }}
      - uses: actions/upload-artifact@v4
        with: { name: voice-clone-ai-apk, path: build/app/outputs/flutter-apk/app-release.apk }
